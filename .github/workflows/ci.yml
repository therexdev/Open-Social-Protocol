name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build all workspaces
        run: npm run build:all
      - name: Test
        run: npm test
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-release
          path: packages/contracts/build/release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist
