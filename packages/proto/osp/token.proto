syntax = "proto3";
package token;
import "koinos/options.proto";
message account_state {
  uint64 balance = 1 [jstype = JS_STRING];
  uint64 free_credits = 2 [jstype = JS_STRING];
  uint64 token_credits = 3 [jstype = JS_STRING];
  uint64 updated_at = 4 [jstype = JS_STRING];
  uint32 resource_version = 5;
  uint64 block = 6 [jstype = JS_STRING];
  uint64 free_ticks = 7 [jstype = JS_STRING];
  uint64 token_ticks = 8 [jstype = JS_STRING];
  uint64 transferable = 9 [jstype = JS_STRING];
  uint64 locked = 10 [jstype = JS_STRING];
  uint64 recharge_blocks = 11 [jstype = JS_STRING];
  uint64 ticks_per_unit = 12 [jstype = JS_STRING];
}
message reward_state {
  uint64 day = 1 [jstype = JS_STRING];
  uint64 minted = 2 [jstype = JS_STRING];
}
message config {
  bytes identity = 1 [(koinos.btype) = ADDRESS];
  bytes relationships = 2 [(koinos.btype) = ADDRESS];
  bytes publications = 3 [(koinos.btype) = ADDRESS];
  bytes messaging = 4 [(koinos.btype) = ADDRESS];
  uint64 reward_amount = 5 [jstype = JS_STRING];
  uint64 daily_reward_cap = 6 [jstype = JS_STRING];
  uint64 recipient_daily_cap = 7 [jstype = JS_STRING];
  uint64 supply = 8 [jstype = JS_STRING];
  uint32 resource_version = 9;
  uint64 activation_block = 10 [jstype = JS_STRING];
  uint64 activation_time = 11 [jstype = JS_STRING];
  uint32 economy_version = 12;
}
// @description init
// @read-only false
message init_arguments {
  bytes identity = 1 [(koinos.btype) = ADDRESS];
  bytes relationships = 2 [(koinos.btype) = ADDRESS];
  bytes publications = 3 [(koinos.btype) = ADDRESS];
  bytes messaging = 4 [(koinos.btype) = ADDRESS];
}
message init_result {

}
// @description set reward policy
// @read-only false
message set_reward_policy_arguments {
  uint64 reward_amount = 1 [jstype = JS_STRING];
  uint64 daily_reward_cap = 2 [jstype = JS_STRING];
  uint64 recipient_daily_cap = 3 [jstype = JS_STRING];
}
message set_reward_policy_result {

}
// @description get config
// @read-only true
message get_config_arguments {

}
message get_config_result {
  config value = 1;
}
// @description get account
// @read-only true
message get_account_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}
message get_account_result {
  account_state value = 1;
  uint64 capacity = 2 [jstype = JS_STRING];
}
// @description support
// @read-only false
message support_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes device = 3 [(koinos.btype) = ADDRESS];
}
message support_result {
  uint64 reward = 1 [jstype = JS_STRING];
}
// @description transfer
// @read-only false
message transfer_arguments {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  bytes to = 2 [(koinos.btype) = ADDRESS];
  uint64 value = 3 [jstype = JS_STRING];
}
message transfer_result {

}
// @description burn
// @read-only false
message burn_arguments {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
}
message burn_result {

}
// @description consume
// @read-only false
message consume_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 units = 2 [jstype = JS_STRING];
}
message consume_result {

}
// @description balance of
// @read-only true
message balance_of_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
}
message balance_of_result {
  uint64 value = 1 [jstype = JS_STRING];
}
// @description total supply
// @read-only true
message total_supply_arguments {

}
message total_supply_result {
  uint64 value = 1 [jstype = JS_STRING];
}
// @description name
// @read-only true
message name_arguments {

}
message name_result {
  string value = 1;
}
// @description symbol
// @read-only true
message symbol_arguments {

}
message symbol_result {
  string value = 1;
}
// @description decimals
// @read-only true
message decimals_arguments {

}
message decimals_result {
  uint32 value = 1;
}
message account_updated_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  account_state value = 2;
  uint64 timestamp = 3 [jstype = JS_STRING];
}
message supported_event {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes recipient = 2 [(koinos.btype) = ADDRESS];
  bytes post_id = 3;
  uint64 reward = 4 [jstype = JS_STRING];
  uint64 timestamp = 5 [jstype = JS_STRING];
}
message transfer_event {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  bytes to = 2 [(koinos.btype) = ADDRESS];
  uint64 value = 3 [jstype = JS_STRING];
  uint64 timestamp = 4 [jstype = JS_STRING];
}
message burn_event {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
  uint64 timestamp = 3 [jstype = JS_STRING];
}
message policy_changed_event {
  uint64 reward_amount = 1 [jstype = JS_STRING];
  uint64 daily_reward_cap = 2 [jstype = JS_STRING];
  uint64 recipient_daily_cap = 3 [jstype = JS_STRING];
  uint64 timestamp = 4 [jstype = JS_STRING];
}

// Internal v2 storage. Existing account/config field numbers remain unchanged.
message recharge_state {
  uint64 free_ready = 1 [jstype = JS_STRING];
  uint64 paid_ready = 2 [jstype = JS_STRING];
  uint64 block = 3 [jstype = JS_STRING];
  uint64 revision = 4 [jstype = JS_STRING];
}
message recharge_node {
  uint64 count = 1 [jstype = JS_STRING];
  uint64 deadlines = 2 [jstype = JS_STRING];
  uint64 revision = 3 [jstype = JS_STRING];
  uint64 floor = 4 [jstype = JS_STRING];
}
// @description activate five-day recharge atomically with an in-place upgrade
// @read-only false
message activate_recharge_arguments {}
message activate_recharge_result {}

message recharge_activated_event {
  uint32 resource_version = 1;
  uint64 activation_block = 2 [jstype = JS_STRING];
  uint64 activation_time = 3 [jstype = JS_STRING];
  uint64 recharge_blocks = 4 [jstype = JS_STRING];
  uint64 free_units = 5 [jstype = JS_STRING];
}

// Testnet economy v1. Independent of the resource schema version. Parameters
// are fixed at activation; a future policy needs a versioned upgrade.
message economy_config {
  uint32 version = 1;
  uint64 activation_block = 2 [jstype = JS_STRING];
  uint64 period_blocks = 3 [jstype = JS_STRING];
  uint64 period_budget = 4 [jstype = JS_STRING];
  uint64 curve_constant = 5 [jstype = JS_STRING];
  uint64 score_scale = 6 [jstype = JS_STRING];
  uint64 max_vote_weight = 7 [jstype = JS_STRING];
  uint64 max_period_weight = 8 [jstype = JS_STRING];
  uint64 promotion_price = 9 [jstype = JS_STRING];
  uint64 promotion_interval = 10 [jstype = JS_STRING];
  uint32 max_opportunities = 11;
  uint32 promotion_slots = 12;
  uint64 reserved = 13 [jstype = JS_STRING];
  uint64 bootstrap_minted = 14 [jstype = JS_STRING];
}
message reward_epoch {
  uint64 id = 1 [jstype = JS_STRING];
  uint64 start_block = 2 [jstype = JS_STRING];
  uint64 end_block = 3 [jstype = JS_STRING];
  uint64 budget = 4 [jstype = JS_STRING];
  uint64 total_score = 5 [jstype = JS_STRING];
  uint64 total_weight = 6 [jstype = JS_STRING];
  uint64 post_count = 7 [jstype = JS_STRING];
  uint64 settled_count = 8 [jstype = JS_STRING];
  uint64 paid = 9 [jstype = JS_STRING];
}
message post_reward {
  bytes post_id = 1;
  bytes version = 2;
  bytes author = 3 [(koinos.btype) = ADDRESS];
  uint64 epoch = 4 [jstype = JS_STRING];
  uint64 up = 5 [jstype = JS_STRING];
  uint64 down = 6 [jstype = JS_STRING];
  uint64 score = 7 [jstype = JS_STRING];
  bool settled = 8;
  uint64 reward = 9 [jstype = JS_STRING];
}
message ballot {
  uint32 direction = 1; // 1 up, 2 down. Both consume paid capacity equally.
  uint64 weight = 2 [jstype = JS_STRING];
  uint64 block = 3 [jstype = JS_STRING];
}
message promotion {
  bytes post_id = 1;
  bytes version = 2;
  bytes author = 3 [(koinos.btype) = ADDRESS];
  uint64 nonce = 4 [jstype = JS_STRING];
  uint32 slot = 5;
  uint64 start_block = 6 [jstype = JS_STRING];
  uint64 end_block = 7 [jstype = JS_STRING];
  uint64 interval = 8 [jstype = JS_STRING];
  uint32 opportunities = 9;
  uint64 burned = 10 [jstype = JS_STRING];
  bool cancelled = 11;
}
// @description Activate bounded Harbinger reward voting and promotion (contract account only)
// @read-only false
message activate_economy_arguments {
  // Zero selects the 144,000-block public pilot. A shorter period is only for
  // an isolated Harbinger rehearsal; it never changes the resource recharge.
  uint64 test_period_blocks = 1 [jstype = JS_STRING];
}
message activate_economy_result {}
// @description Allocate disclosed test tokens to registered testers (contract account only, Harbinger only)
// @read-only false
message grant_test_tokens_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
}
message grant_test_tokens_result {}
// @description Cast one immutable paid up/down ballot on the exact public post version
// @read-only false
message vote_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes version = 3;
  uint32 direction = 4;
  uint64 weight = 5 [jstype = JS_STRING];
  bytes device = 6 [(koinos.btype) = ADDRESS];
}
message vote_result {}
// @description Settle a closed-period post to its recorded author; no resource refund
// @read-only false
message settle_reward_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes device = 3 [(koinos.btype) = ADDRESS];
}
message settle_reward_result { uint64 reward = 1 [jstype = JS_STRING]; }
// @description Burn an exact approved amount for public-post promotion (owner only)
// @read-only false
message promote_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes version = 3;
  uint64 nonce = 4 [jstype = JS_STRING];
  uint32 slot = 5;
  uint32 opportunities = 6;
  uint64 burn_amount = 7 [jstype = JS_STRING];
}
message promote_result {}
// @description Stop a promotion without refunding its burn (owner only)
// @read-only false
message cancel_promotion_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  uint64 nonce = 3 [jstype = JS_STRING];
}
message cancel_promotion_result {}
// @description Get economy policy and current block/period
// @read-only true
message get_economy_arguments {}
message get_economy_result {
  economy_config value = 1;
  uint64 block = 2 [jstype = JS_STRING];
  uint64 current_epoch = 3 [jstype = JS_STRING];
}
// @description Get a post's reward, ballot, period and last promotion
// @read-only true
message get_post_economy_arguments {
  bytes post_id = 1;
  bytes viewer = 2 [(koinos.btype) = ADDRESS];
}
message get_post_economy_result {
  post_reward reward = 1;
  ballot vote = 2;
  reward_epoch epoch = 3;
  promotion promotion = 4;
  uint64 block = 5 [jstype = JS_STRING];
}
// @description Get the bounded promotion board, including expired slots for purchase
// @read-only true
message get_promotions_arguments {}
message get_promotions_result {
  repeated promotion values = 1;
  uint64 block = 2 [jstype = JS_STRING];
}
message economy_activated_event { economy_config value = 1; }
message test_tokens_granted_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
  uint64 cumulative = 3 [jstype = JS_STRING];
  uint64 timestamp = 4 [jstype = JS_STRING];
}
message voted_event {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  post_reward value = 2;
  ballot vote = 3;
  reward_epoch epoch = 4;
  uint64 timestamp = 5 [jstype = JS_STRING];
}
message reward_settled_event {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  post_reward value = 2;
  reward_epoch epoch = 3;
  uint64 timestamp = 4 [jstype = JS_STRING];
}
message promotion_changed_event {
  promotion value = 1;
  uint64 timestamp = 2 [jstype = JS_STRING];
}
