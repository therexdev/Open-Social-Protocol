syntax = "proto3";

// Open Social Protocol - Publication contract (protocol v1)
//
// Signed, versioned publications (posts, replies), lifecycle facts,
// non-economic reactions, audience-key distribution and cross-post outcome
// records. Publication content lives in transaction/event history; active
// contract state keeps only what later validation requires (post existence,
// author, latest version, lifecycle state, author sequence, idempotency keys).
//
// Identifier rules (normative, see docs/protocol-spec.md):
//   content_hash = sha256(envelope_bytes)
//   post_id      = sha256("osp/v1/post-id" || chain_id || u32be(protocol_version)
//                         || author(25 bytes) || u64be(sequence) || content_hash)
// A version is identified by its content_hash. Edits publish a new version under
// the same post_id and must reference the previous version's content_hash.

package publications;

import "koinos/options.proto";

enum audience_kind {
  everyone = 0;
  friends = 1;
  custom = 2;
}

enum lifecycle_state {
  active = 0;
  author_hidden = 1;
  deleted = 2;
  unavailable = 3;
  migrated = 4;
  superseded = 5;
}

enum outcome_state {
  succeeded = 0;
  partial = 1;
  unknown = 2;
  failed = 3;
  reconcile_required = 4;
}

message media_ref {
  // sha256 of the encrypted media bytes.
  bytes content_hash = 1;
  string mime = 2;
  uint64 size = 3 [jstype = JS_STRING];
  // Content identifiers or URLs where identical ciphertext can be fetched.
  repeated string locations = 4;
  // Reference to the key material protecting this media (opaque to the contract).
  bytes key_ref = 5;
}

message post_record {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  uint64 sequence = 2 [jstype = JS_STRING];
  uint32 version_count = 3;
  bytes latest_version = 4;
  lifecycle_state state = 5;
  bytes reply_to = 6;
  audience_kind audience = 7;
  uint64 created_at = 8 [jstype = JS_STRING];
  uint64 updated_at = 9 [jstype = JS_STRING];
  bytes collection_id = 10;
  bool gallery_only = 11;
}

message author_state {
  uint64 next_sequence = 1 [jstype = JS_STRING];
  uint64 last_publish_at = 2 [jstype = JS_STRING];
  uint64 post_count = 3 [jstype = JS_STRING];
}

message limits {
  uint32 max_envelope_bytes = 1;
  uint32 max_media_refs = 2;
  uint32 max_key_package_bytes = 3;
  uint32 max_idempotency_key_bytes = 4;
  uint32 max_location_chars = 5;
  uint32 protocol_version = 6;
}

message post_ref {
  bytes post_id = 1;
}

// ---------------------------------------------------------------------------
// Admin
// ---------------------------------------------------------------------------

// @description Set the identity contract used for actor resolution (contract account only)
// @read-only false
message set_identity_contract_arguments {
  bytes address = 1 [(koinos.btype) = ADDRESS];
}
message set_identity_contract_result {}

// @description Set the relationships contract used for block checks (contract account only)
// @read-only false
message set_relationships_contract_arguments {
  bytes address = 1 [(koinos.btype) = ADDRESS];
}
message set_relationships_contract_result {}

// ---------------------------------------------------------------------------
// Write methods
// ---------------------------------------------------------------------------

// @description Publish a post, reply, or a new version of an existing post
// @read-only false
message publish_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  // Empty for the first version; previous content_hash for edits.
  bytes previous_version = 3;
  // Must equal the author's next_sequence for a first version; ignored for edits.
  uint64 sequence = 4 [jstype = JS_STRING];
  audience_kind audience = 5;
  // Audience identifier: empty for everyone/friends (friends implies the author's
  // friends audience), or a custom audience id.
  bytes audience_id = 6;
  uint32 epoch = 7;
  // Encrypted (or plaintext for everyone) content envelope, at most max_envelope_bytes.
  bytes envelope = 8;
  // sha256 of envelope; verified on-chain when envelope is non-empty.
  bytes content_hash = 9;
  repeated media_ref media = 10;
  // post_id of the parent when this publication is a reply/comment.
  bytes reply_to = 11;
  // Client-chosen idempotency key (<= 32 bytes). Duplicate keys per author are rejected.
  bytes idempotency_key = 12;
  bytes device = 13 [(koinos.btype) = ADDRESS];
  // Public, immutable poll created atomically with the first publication.
  poll_definition poll = 14;
  bytes collection_id = 15;
  bool gallery_only = 16;
}
message publish_result {}

// @description Set the lifecycle state of a post version (tombstone, hide, supersede)
// @read-only false
message set_lifecycle_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes version = 3;
  lifecycle_state state = 4;
  string reason = 5;
  // Replacement post_id for migrated/superseded states.
  bytes replacement_id = 6;
  bytes device = 7 [(koinos.btype) = ADDRESS];
}
message set_lifecycle_result {}

// @description Add or remove a non-economic reaction
// @read-only false
message react_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  // Reaction type code; 1 = like. Additional codes are client vocabulary.
  uint32 reaction = 3;
  bool remove = 4;
  bytes device = 5 [(koinos.btype) = ADDRESS];
}
message react_result {}

// @description Distribute sealed audience-epoch keys to audience members (event only)
// @read-only false
message distribute_keys_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes audience_id = 2;
  uint32 epoch = 3;
  // Encoded osp.envelope.key_package_set (see packages/proto/osp/envelope.proto).
  bytes packages = 4;
  bytes device = 5 [(koinos.btype) = ADDRESS];
}
message distribute_keys_result {}

// @description Record the outcome of a cross-platform publication attempt
// @read-only false
message record_cross_post_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes idempotency_key = 2;
  // Adapter identifier, e.g. "facebook", "atproto".
  string adapter = 3;
  outcome_state state = 4;
  // External identifier or URL of the host-site publication.
  string external_ref = 5;
  bytes post_id = 6;
  // sha256 of the signed proof manifest.
  bytes manifest_hash = 7;
  bytes device = 8 [(koinos.btype) = ADDRESS];
}
message record_cross_post_result {}

// ---------------------------------------------------------------------------
// Read methods
// ---------------------------------------------------------------------------

// @description Get compact post state
// @read-only true
message get_post_arguments {
  bytes post_id = 1;
}
message get_post_result {
  post_record value = 1;
}

// @description Get an author's sequence state
// @read-only true
message get_author_state_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
}
message get_author_state_result {
  author_state value = 1;
}

// @description Resolve an idempotency key to the post it created
// @read-only true
message get_post_by_idempotency_key_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes idempotency_key = 2;
}
message get_post_by_idempotency_key_result {
  post_ref value = 1;
}

// @description Get protocol limits enforced by this contract
// @read-only true
message get_limits_arguments {}
message get_limits_result {
  limits value = 1;
}

// @description Get configured dependency contracts
// @read-only true
message get_dependencies_arguments {}
message get_dependencies_result {
  bytes identity = 1 [(koinos.btype) = ADDRESS];
  bytes relationships = 2 [(koinos.btype) = ADDRESS];
}

// ---------------------------------------------------------------------------
// Events (name prefix: osp.publications.*)
// ---------------------------------------------------------------------------

message published_event {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes content_hash = 3;
  bytes previous_version = 4;
  uint32 version_number = 5;
  uint64 sequence = 6 [jstype = JS_STRING];
  audience_kind audience = 7;
  bytes audience_id = 8;
  uint32 epoch = 9;
  bytes envelope = 10;
  repeated media_ref media = 11;
  bytes reply_to = 12;
  bytes idempotency_key = 13;
  uint32 protocol_version = 14;
  uint64 timestamp = 15 [jstype = JS_STRING];
  bytes collection_id = 16;
  bool gallery_only = 17;
}

message lifecycle_event {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes version = 3;
  lifecycle_state state = 4;
  string reason = 5;
  bytes replacement_id = 6;
  uint64 timestamp = 7 [jstype = JS_STRING];
}

message reaction_event {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  bytes post_author = 3 [(koinos.btype) = ADDRESS];
  uint32 reaction = 4;
  bool removed = 5;
  uint64 timestamp = 6 [jstype = JS_STRING];
}

message keys_distributed_event {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes audience_id = 2;
  uint32 epoch = 3;
  bytes packages = 4;
  uint64 timestamp = 5 [jstype = JS_STRING];
}

message cross_post_outcome_event {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes idempotency_key = 2;
  string adapter = 3;
  outcome_state state = 4;
  string external_ref = 5;
  bytes post_id = 6;
  bytes manifest_hash = 7;
  uint64 timestamp = 8 [jstype = JS_STRING];
}

// @description Configure protocol usage limits (contract account only)
// @read-only false
message set_token_contract_arguments { bytes address = 1 [(koinos.btype) = ADDRESS]; }
message set_token_contract_result {}
// @description Get protocol usage contract
// @read-only true
message get_token_contract_arguments {}
message get_token_contract_result { bytes value = 1 [(koinos.btype) = ADDRESS]; }

// Poll ballots are participation, never automatic reward votes. Choices are public.
message poll_definition {
  string question = 1;
  repeated string options = 2;
  uint64 closes_at = 3 [jstype = JS_STRING];
}
message poll_record {
  poll_definition definition = 1;
  repeated uint32 counts = 2;
  uint32 participants = 3;
  uint32 engagement_participants = 4;
  // floor(250 * sqrt(non-author participants)); 1000 = one engagement point.
  uint64 engagement_milli = 5 [jstype = JS_STRING];
}
message poll_ballot { uint32 option = 1; }
// @description Answer a public poll or change your existing answer (does not upvote)
// @read-only false
message answer_poll_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  bytes post_id = 2;
  uint32 option = 3;
  bytes device = 4 [(koinos.btype) = ADDRESS];
}
message answer_poll_result {}
// @description Read poll totals and optionally one account's current answer
// @read-only true
message get_poll_arguments {
  bytes post_id = 1;
  bytes viewer = 2 [(koinos.btype) = ADDRESS];
}
message get_poll_result { poll_record value = 1; poll_ballot ballot = 2; uint64 now = 3 [jstype = JS_STRING]; }
message poll_created_event { bytes post_id = 1; poll_record poll = 2; }
message poll_answered_event {
  bytes post_id = 1;
  bytes actor = 2 [(koinos.btype) = ADDRESS];
  poll_ballot ballot = 3;
  poll_record poll = 4;
  uint64 timestamp = 5 [jstype = JS_STRING];
}

// Archive v1. Bytes live in canonical event history; state commits to every
// chunk. One 32 KiB allocation unit consumes one regenerating usage unit.
message photo_archive_record {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes digest = 2;
  uint32 size = 3;
  repeated bytes chunk_hashes = 4;
  uint32 received = 5;
  uint32 units = 6;
}
// @description Begin a resumable photo archive; charge size-based usage once
// @read-only false
message begin_photo_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  bytes digest = 3;
  uint32 size = 4;
  repeated bytes chunk_hashes = 5;
  bytes device = 6 [(koinos.btype) = ADDRESS];
}
message begin_photo_result {}
// @description Append the next verified 16 KiB archive chunk, idempotently
// @read-only false
message append_photo_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  uint32 index = 3;
  bytes data = 4;
  bytes device = 5 [(koinos.btype) = ADDRESS];
}
message append_photo_result {}
// @description Read the authoritative archive commitment and upload progress
// @read-only true
message get_photo_arguments { bytes id = 1; }
message get_photo_result { photo_archive_record value = 1; }
// @description Archive and collections capability version
// @read-only true
message get_library_version_arguments {}
message get_library_version_result { uint32 version = 1; }
message photo_chunk_event { bytes id = 1; uint32 index = 2; bytes data = 3; }
message photo_started_event { bytes id = 1; photo_archive_record value = 2; }

// Albums (kind 1) and private groups (kind 2). Private metadata is an ordinary
// encrypted content envelope. Membership is public routing data, not a secret.
message collection_record {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  uint32 kind = 2;
  uint32 revision = 3;
  audience_kind audience = 4;
  repeated bytes members = 5 [(koinos.btype) = ADDRESS];
  bytes envelope = 6;
  bool closed = 7;
}
// @description Create or update an album/group using compare-and-swap revision
// @read-only false
message save_collection_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  uint32 previous_revision = 3;
  uint32 kind = 4;
  audience_kind audience = 5;
  repeated bytes members = 6 [(koinos.btype) = ADDRESS];
  bytes envelope = 7;
  bool closed = 8;
  bytes device = 9 [(koinos.btype) = ADDRESS];
}
message save_collection_result {}
// @description Read current album/group membership and metadata
// @read-only true
message get_collection_arguments { bytes id = 1; }
message get_collection_result { collection_record value = 1; }
message collection_changed_event { bytes id = 1; collection_record value = 2; }
message album_item_record { bytes envelope = 1; uint32 epoch = 2; uint32 revision = 3; bool removed = 4; }
// @description Add, update or remove a photo reference in an owned album
// @read-only false
message set_album_item_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes collection_id = 2;
  bytes id = 3;
  uint32 epoch = 4;
  uint32 previous_revision = 5;
  bytes envelope = 6;
  bool removed = 7;
  bytes device = 8 [(koinos.btype) = ADDRESS];
}
message set_album_item_result {}
// @description Verify an album entry against canonical state
// @read-only true
message get_album_item_arguments { bytes collection_id = 1; bytes id = 2; }
message get_album_item_result { album_item_record value = 1; }
message album_item_changed_event { bytes collection_id = 1; bytes id = 2; album_item_record value = 3; }

// Music v2: immutable manifests, batched ciphertext, audience-gated key delivery and OSAT escrow.
message music_config {
  uint32 version = 1;
  uint32 revision = 2;
  bytes recipient = 3 [(koinos.btype) = ADDRESS];
  uint64 rate_per_mb = 4 [jstype = JS_STRING];
  uint32 max_bytes = 5;
  bool enabled = 6;
  bytes native_token = 7 [(koinos.btype) = ADDRESS];
}
message music_record {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes digest = 2;
  uint32 size = 3;
  repeated bytes chunk_hashes = 4;
  uint32 received = 5;
  string title = 6;
  string mime = 7;
  uint32 duration_ms = 8;
  uint64 fee = 9 [jstype = JS_STRING];
  bytes recipient = 10 [(koinos.btype) = ADDRESS];
  bytes payer = 11 [(koinos.btype) = ADDRESS];
  string artist = 12;
  string description = 13;
  // 0 public, 1 current friends, 2 current private-group members.
  uint32 audience = 14;
  bytes group_id = 15;
  bool encrypted = 16;
  bytes nonce = 17;
  music_key owner_key = 18;
  uint64 unlock_price = 19 [jstype = JS_STRING];
  uint32 version = 20;
  bytes key_hash = 21;
}
// @description Set native KOIN music pricing (contract authority only)
// @read-only false
message set_music_config_arguments {
  bytes recipient = 1 [(koinos.btype) = ADDRESS];
  uint64 rate_per_mb = 2 [jstype = JS_STRING];
  uint32 max_bytes = 3;
  bool enabled = 4;
}
message set_music_config_result {}
// @description Music upload pricing and availability
// @read-only true
message get_music_config_arguments {}
message get_music_config_result { music_config value = 1; }
// @description Pay once and reserve an immutable public audio upload
// @read-only false
message begin_music_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  bytes digest = 3;
  uint32 size = 4;
  repeated bytes chunk_hashes = 5;
  string title = 6;
  string mime = 7;
  uint32 duration_ms = 8;
  uint32 config_revision = 9;
  uint64 max_fee = 10 [jstype = JS_STRING];
  bytes payer = 11 [(koinos.btype) = ADDRESS];
  bytes device = 12 [(koinos.btype) = ADDRESS];
  string artist = 13;
  string description = 14;
  uint32 audience = 15;
  bytes group_id = 16;
  bool encrypted = 17;
  bytes nonce = 18;
  music_key owner_key = 19;
  uint64 unlock_price = 20 [jstype = JS_STRING];
  bytes key_hash = 21;
}
message begin_music_result {}
// @description Append a committed music chunk; identical retries are free
// @read-only false
message append_music_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  uint32 index = 3;
  bytes data = 4;
  bytes device = 5 [(koinos.btype) = ADDRESS];
}
message append_music_result {}
// @description Read an upload and its payment receipt
// @read-only true
message get_music_arguments { bytes id = 1; }
message get_music_result { music_record value = 1; }
// @description Read audio bytes directly from contract state
// @read-only true
message get_music_chunk_arguments { bytes id = 1; uint32 index = 2; }
message get_music_chunk_result { bytes data = 1; }
// @description List complete public tracks belonging to one profile (20 per page)
// @read-only true
message list_music_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes after = 2;
  bytes group_id = 3;
}
message list_music_result { repeated bytes ids = 1; }
message music_paid_event { bytes id = 1; music_record value = 2; }
message music_completed_event { bytes id = 1; bytes owner = 2 [(koinos.btype) = ADDRESS]; }

// Wire-compatible KCS-4 allowance, used only in the atomic music payment bundle.
message music_native_approval {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes spender = 2 [(koinos.btype) = ADDRESS];
  uint64 value = 3 [jstype = JS_STRING];
}

// All key packages are recipient-sealed X25519/XChaCha20 keys. Never plaintext.
message music_key {
  uint32 key_version = 1;
  bytes ephemeral_public_key = 2;
  bytes nonce = 3;
  bytes ciphertext = 4;
}
message music_progress { uint32 received = 1; }
// @description Append up to four sequential committed 16 KiB chunks atomically
// @read-only false
message append_music_batch_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  uint32 index = 3;
  repeated bytes chunks = 4;
  bytes device = 5 [(koinos.btype) = ADDRESS];
}
message append_music_batch_result {}
// status: 1 awaiting delivery, 2 delivered, 3 refunded. Free grants use amount 0.
message music_access {
  bytes id = 1;
  bytes buyer = 2 [(koinos.btype) = ADDRESS];
  uint64 amount = 3 [jstype = JS_STRING];
  uint64 expires_at = 4 [jstype = JS_STRING];
  uint32 status = 5;
  music_key key = 6;
  bytes public_key = 7;
  uint32 key_version = 8;
  bytes payment_id = 9;
}
// @description Request an encrypted reading key; reserve OSAT until delivery
// @read-only false
message request_music_access_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  uint64 max_price = 3 [jstype = JS_STRING];
}
message request_music_access_result {}
// @description Deliver a recipient-sealed key and release any pending OSAT payment
// @read-only false
message grant_music_access_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  bytes buyer = 3 [(koinos.btype) = ADDRESS];
  music_key key = 4;
}
message grant_music_access_result {}
// @description Refund an undelivered unlock after 24 hours, or lost audience eligibility
// @read-only false
message refund_music_access_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
}
message refund_music_access_result {}
// @description Read a music license and authoritative audience eligibility
// @read-only true
message get_music_access_arguments { bytes id = 1; bytes buyer = 2 [(koinos.btype) = ADDRESS]; }
message get_music_access_result { music_access value = 1; bool eligible = 2; uint64 now = 3 [jstype = JS_STRING]; }
// @description List pending key deliveries for an uploader, 20 per page
// @read-only true
message list_music_requests_arguments { bytes owner = 1 [(koinos.btype) = ADDRESS]; bytes after = 2; }
message list_music_requests_result { repeated music_access items = 1; bytes next = 2; }
message music_access_event { bytes owner = 1 [(koinos.btype) = ADDRESS]; music_access value = 2; }
message music_comment {
  bytes id = 1;
  bytes author = 2 [(koinos.btype) = ADDRESS];
  bytes body = 3;
  bytes nonce = 4;
  bytes reply_to = 5;
  uint64 created_at = 6 [jstype = JS_STRING];
  bool deleted = 7;
}
// @description Comment on a completed track; restricted or paid comments must be encrypted
// @read-only false
message comment_music_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  bytes id = 2;
  bytes comment_id = 3;
  bytes body = 4;
  bytes nonce = 5;
  bytes reply_to = 6;
}
message comment_music_result {}
// @description Delete your own track comment
// @read-only false
message delete_music_comment_arguments { bytes author = 1 [(koinos.btype) = ADDRESS]; bytes id = 2; bytes comment_id = 3; }
message delete_music_comment_result {}
// @description List track comments in publication order, 20 per page
// @read-only true
message list_music_comments_arguments { bytes id = 1; bytes after = 2; }
message list_music_comments_result { repeated music_comment items = 1; bytes next = 2; }
message music_comment_event { bytes track_id = 1; music_comment value = 2; }
