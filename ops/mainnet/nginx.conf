# Replace names if your GitHub variables use different mainnet domains.
# Install this HTTP config, then let certbot add HTTPS for these two hosts.
server {
    listen 80;
    server_name api.opensocial.online;
    location / {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
server {
    listen 80;
    server_name sponsor.opensocial.online;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
